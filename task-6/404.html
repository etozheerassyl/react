<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aegis Core Routing Redirect</title>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var routePath = pathname.replace(/^.*task-6\/?/, '');
        var basePrefix = pathname.includes('/react/') ? '/react/task-6/' : '/task-6/';
        if (!pathname.includes('task-6')) basePrefix = '/';
        var newUrl = l.protocol + '//' + l.host + basePrefix + (routePath ? '#/' + routePath : '#/') + l.search + l.hash;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Aegis Core Subsystem...</p>
  </body>
</html>
