name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build task-3
        run: |
          cd task-3
          npm ci
          npm run build
          cd ..
          mkdir -p ./dist/task-3
          cp -r task-3/dist/* ./dist/task-3/

      - name: Build task-4
        run: |
          cd task-4
          npm ci
          npm run build
          cd ..
          mkdir -p ./dist/task-4
          cp -r task-4/dist/* ./dist/task-4/

      - name: Build midterm
        run: |
          cd midterm
          npm ci
          npm run build
          cd ..
          mkdir -p ./dist/midterm
          cp -r midterm/dist/* ./dist/midterm/

      - name: Build task-5
        run: |
          cd task-5
          npm ci
          npm run build
          cd ..
          mkdir -p ./dist/task-5
          cp -r task-5/dist/* ./dist/task-5/
          mkdir -p "./dist/task 5"
          cp -r task-5/dist/* "./dist/task 5/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
